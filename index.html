<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Pulse Check · Parliament</title>
  <!--
    Hemicycle layout algorithm ported from:
      https://github.com/slashme/parliamentdiagram (GPL v2)
    JavaScript port reference:
      https://gist.github.com/compupro/f4df98ad750f44669be51a3580443936 (GPL v2)
    This file is also licensed under GPL v2.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/parliament/manifest.json" />
</head>
<body>

<header>
  <div class="eyebrow">Pulse Check</div>
  <h1>How do you see things?</h1>
</header>

<div class="card">
  <div class="card-label">Enter counts</div>
  <div class="input-row">
    <div class="input-group support">
      <label for="inp-s">Support</label>
      <div class="m3-field"><input id="inp-s" type="number" readonly tabindex="-1" value="0" /></div>
      <button class="btn-add" data-category="support">+ Add reason</button>
      <!-- 内联表单（默认隐藏） -->
      <div class="reason-form" id="form-support" hidden>
        <div class="reason-input-area">
          <div class="reason-input-stack">
            <input class="reason-text" type="text" placeholder="Reason…" maxlength="120" />
            <input class="reason-score" type="number" min="1" placeholder="Score" />
          </div>
          <button class="btn-next" aria-label="下一步">→</button>
        </div>
        <div class="reason-form-actions">
          <button class="btn-confirm">✓</button>
          <button class="btn-cancel">✗</button>
        </div>
      </div>
      <!-- 可折叠列表区 -->
      <div class="reason-section" id="section-support">
        <button class="reason-toggle" aria-expanded="false">0 reasons ▾</button>
        <ul class="reason-list" id="list-support"></ul>
      </div>
    </div>

    <div class="input-group oppose">
      <label for="inp-o">Oppose</label>
      <div class="m3-field"><input id="inp-o" type="number" readonly tabindex="-1" value="0" /></div>
      <button class="btn-add" data-category="oppose">+ Add reason</button>
      <div class="reason-form" id="form-oppose" hidden>
        <div class="reason-input-area">
          <div class="reason-input-stack">
            <input class="reason-text" type="text" placeholder="Reason…" maxlength="120" />
            <input class="reason-score" type="number" min="1" placeholder="Score" />
          </div>
          <button class="btn-next" aria-label="Next">→</button>
        </div>
        <div class="reason-form-actions">
          <button class="btn-confirm">✓</button>
          <button class="btn-cancel">✗</button>
        </div>
      </div>
      <div class="reason-section" id="section-oppose">
        <button class="reason-toggle" aria-expanded="false">0 reasons ▾</button>
        <ul class="reason-list" id="list-oppose"></ul>
      </div>
    </div>

    <div class="input-group neutral">
      <label for="inp-n">Neutral</label>
      <div class="m3-field"><input id="inp-n" type="number" readonly tabindex="-1" value="0" /></div>
      <button class="btn-add" data-category="neutral">+ Add reason</button>
      <div class="reason-form" id="form-neutral" hidden>
        <div class="reason-input-area">
          <div class="reason-input-stack">
            <input class="reason-text" type="text" placeholder="Reason…" maxlength="120" />
            <input class="reason-score" type="number" min="1" placeholder="Score" />
          </div>
          <button class="btn-next" aria-label="下一步">→</button>
        </div>
        <div class="reason-form-actions">
          <button class="btn-confirm">✓</button>
          <button class="btn-cancel">✗</button>
        </div>
      </div>
      <div class="reason-section" id="section-neutral">
        <button class="reason-toggle" aria-expanded="false">0 reasons ▾</button>
        <ul class="reason-list" id="list-neutral"></ul>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="rate-strip">
    <div class="rate-label">Support rate</div>
    <div class="rate-value" id="rate-el">—</div>
  </div>
</div>

<div class="card">
  <div class="card-label">Parliament view</div>
  <canvas id="hemicycle"></canvas>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--support)"></div>Support</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--neutral)"></div>Neutral</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--oppose)"></div>Oppose</div>
  </div>
</div>

<footer>Total · <span id="total-el">—</span> seats</footer>

<script src="script.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/parliament/sw.js').then(reg => {
        console.log('Service Worker registered', reg);
      }).catch(err => {
        console.log('SW registration failed', err);
      });
    });
  }
</script>

</body>
</html>
