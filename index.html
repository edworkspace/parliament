<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Check · Parliament</title>
  <!--
    Hemicycle layout algorithm ported from:
      https://github.com/slashme/parliamentdiagram (GPL v2)
    JavaScript port reference:
      https://gist.github.com/compupro/f4df98ad750f44669be51a3580443936 (GPL v2)
    This file is also licensed under GPL v2.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:             #FDFBFF;
      --surface-low:    #F7F2FA;
      --surface:        #F3EDF7;
      --on-surface:     #1C1B1F;
      --on-surface-var: #49454E;
      --outline:        #7A757F;
      --outline-var:    #CAC4D0;
      --support: #1A6BBF;
      --oppose:  #BA1A1A;
      --neutral: #6B5778;
      --r-xl: 28px; --r-md: 16px; --r-sm: 8px;
      --ff: 'Google Sans', sans-serif;
      --fm: 'Google Sans Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff);
      background: var(--bg);
      color: var(--on-surface);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 20px 56px;
    }
    header { text-align: center; margin-bottom: 28px; }
    .eyebrow {
      font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
      color: var(--on-surface-var); margin-bottom: 4px;
    }
    h1 { font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
    .card {
      background: var(--surface-low); border-radius: var(--r-xl);
      padding: 20px 22px; width: 100%; max-width: 520px; margin-bottom: 14px;
    }
    .card-label {
      font-size: 11px; font-weight: 500; letter-spacing: .06em;
      text-transform: uppercase; color: var(--on-surface-var); margin-bottom: 14px;
    }
    .input-row { display: flex; gap: 10px; }
    .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .input-group label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .input-group.support label { color: var(--support); }
    .input-group.oppose  label { color: var(--oppose); }
    .input-group.neutral label { color: var(--neutral); }
    .m3-field input {
      width: 100%; border: 1px solid var(--outline-var); border-radius: var(--r-sm);
      background: var(--bg); font-family: var(--fm); font-size: 22px;
      color: var(--on-surface); text-align: center; padding: 10px 6px;
      outline: none; transition: border-color .15s, box-shadow .15s;
      -moz-appearance: textfield;
    }
    .m3-field input::-webkit-inner-spin-button,
    .m3-field input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .input-group.support .m3-field input:focus { border-color: var(--support); box-shadow: 0 0 0 2px color-mix(in srgb, var(--support) 18%, transparent); }
    .input-group.oppose  .m3-field input:focus { border-color: var(--oppose);  box-shadow: 0 0 0 2px color-mix(in srgb, var(--oppose)  18%, transparent); }
    .input-group.neutral .m3-field input:focus { border-color: var(--neutral); box-shadow: 0 0 0 2px color-mix(in srgb, var(--neutral) 18%, transparent); }
    .rate-strip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border-radius: var(--r-md); padding: 14px 18px;
    }
    .rate-label { font-size: 13px; color: var(--on-surface-var); }
    .rate-value { font-family: var(--fm); font-size: 30px; font-weight: 500; color: var(--support); letter-spacing: -.02em; }
    .rate-value span { font-size: 15px; opacity: .65; margin-left: 1px; }
    #hemicycle { width: 100%; display: block; border-radius: var(--r-md); }
    .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-surface-var); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    footer { margin-top: 6px; font-size: 11px; color: var(--outline); text-align: center; }
  </style>
</head>
<body>

<header>
  <div class="eyebrow">Pulse Check</div>
  <h1>How do you see things?</h1>
</header>

<div class="card">
  <div class="card-label">Enter counts</div>
  <div class="input-row">
    <div class="input-group support">
      <label for="inp-s">Support</label>
      <div class="m3-field"><input id="inp-s" type="number" min="0" value="42" /></div>
    </div>
    <div class="input-group oppose">
      <label for="inp-o">Oppose</label>
      <div class="m3-field"><input id="inp-o" type="number" min="0" value="18" /></div>
    </div>
    <div class="input-group neutral">
      <label for="inp-n">Neutral</label>
      <div class="m3-field"><input id="inp-n" type="number" min="0" value="10" /></div>
    </div>
  </div>
</div>

<div class="card">
  <div class="rate-strip">
    <div class="rate-label">Support rate</div>
    <div class="rate-value" id="rate-el">—</div>
  </div>
</div>

<div class="card">
  <div class="card-label">Parliament view</div>
  <canvas id="hemicycle"></canvas>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--support)"></div>Support</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--neutral)"></div>Neutral</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--oppose)"></div>Oppose</div>
  </div>
</div>

<footer>Total · <span id="total-el">—</span> seats</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// HEMICYCLE ALGORITHM
// Ported from slashme/parliamentdiagram (GPL v2)
// https://github.com/slashme/parliamentdiagram
// JS port reference: https://gist.github.com/compupro/f4df98ad750f44669be51a3580443936
// ─────────────────────────────────────────────────────────────────────────────

// Maximum seats achievable with N rows (precomputed).
// TOTALS[i] = max seats in (i+1) rows.
const TOTALS = [
  3,15,33,61,95,138,189,247,313,388,469,559,657,762,876,997,1126,1263,
  1408,1560,1722,1889,2066,2250,2442,2641,2850,3064,3289,3519,3759,4005,
  4261,4522,4794,5071,5358,5652,5953,6263,6581,6906,7239,7581,7929,8287,
  8650,9024,9404,9793,10187,10594,11003,11425,11850,12288,12729,13183,
  13638,14109,14580,15066,15553,16055,16557,17075,17592,18126,18660,
  19208,19758,20323,20888,21468,22050,22645,23243,23853,24467,25094,
  25723,26364,27011,27667,28329,29001,29679,30367,31061
];

/**
 * Build a list of seat positions using the slashme arch algorithm.
 * Returns array of {angle, x, y} in the SVG coordinate space where
 * the diagram fits in a 3.5 × 1.75 unit box (origin top-left),
 * centre of the semicircle at x=1.75, y=1.75 (bottom-centre).
 */
function buildSeatPositions(total) {
  if (total === 0) return [];

  // Find minimum number of rows to fit `total` seats
  let rows = 1;
  for (let i = 0; i < TOTALS.length; i++) {
    if (TOTALS[i] >= total) { rows = i + 1; break; }
  }

  const radius = 0.4 / rows; // seat circle radius
  const posList = [];

  // Inner rows 1 … rows-1
  for (let i = 1; i < rows; i++) {
    // Row radius: R_i = (3N + 4i - 2) / (4N)
    const R = (3.0 * rows + 4.0 * i - 2.0) / (4.0 * rows);
    // Seats in this row, scaled to actual total vs max capacity
    const J = Math.floor(
      (total / TOTALS[rows - 1]) *
      Math.PI / (2.0 * Math.asin(2.0 / (3.0 * rows + 4.0 * i - 2.0)))
    );
    if (J === 1) {
      posList.push([Math.PI / 2.0, 1.75 + R * Math.cos(Math.PI / 2.0), R * Math.sin(Math.PI / 2.0)]);
    } else {
      for (let j = 0; j < J; j++) {
        const angle = j * (Math.PI - 2.0 * Math.asin(radius / R)) / (J - 1.0) + Math.asin(radius / R);
        posList.push([angle, 1.75 + R * Math.cos(angle) * -1, R * Math.sin(angle)]);
        // Note: x mirrored so left=oppose, right=support after sort
      }
    }
  }

  // Outermost row gets the remaining seats
  const J_outer = total - posList.length;
  const R_outer = (7.0 * rows - 2.0) / (4.0 * rows);
  if (J_outer === 1) {
    posList.push([Math.PI / 2.0, 1.75 + R_outer * Math.cos(Math.PI / 2.0), R_outer * Math.sin(Math.PI / 2.0)]);
  } else {
    for (let j = 0; j < J_outer; j++) {
      const angle = j * (Math.PI - 2.0 * Math.asin(radius / R_outer)) / (J_outer - 1.0) + Math.asin(radius / R_outer);
      posList.push([angle, 1.75 + R_outer * Math.cos(angle) * -1, R_outer * Math.sin(angle)]);
    }
  }

  // Sort by angle descending → left (oppose) first, right (support) last
  posList.sort((a, b) => b[0] - a[0]);

  return { seats: posList, radius, rows };
}

// ─── Rendering ───────────────────────────────────────────────────────────────

const COLORS = {
  support: '#1A6BBF',
  oppose:  '#BA1A1A',
  neutral: '#6B5778',
  bg:      '#F7F2FA',
  podium:  '#CAC4D0',
};

const canvas  = document.getElementById('hemicycle');
const ctx     = canvas.getContext('2d');
const inpS    = document.getElementById('inp-s');
const inpO    = document.getElementById('inp-o');
const inpN    = document.getElementById('inp-n');
const rateEl  = document.getElementById('rate-el');
const totalEl = document.getElementById('total-el');

function draw() {
  const nS    = Math.max(0, parseInt(inpS.value) || 0);
  const nO    = Math.max(0, parseInt(inpO.value) || 0);
  const nN    = Math.max(0, parseInt(inpN.value) || 0);
  const total = nS + nO + nN;

  if (total === 0) {
    rateEl.innerHTML    = '—';
    totalEl.textContent = '0';
  } else {
    rateEl.innerHTML    = ((nS / total) * 100).toFixed(1) + '<span>%</span>';
    totalEl.textContent = total;
  }

  // The slashme SVG unit box is 3.5 wide × 1.75 tall.
  // We scale by width so the full arc always fits horizontally,
  // then add a small bottom pad so the lowest seats aren't clipped.
  const PAD  = 10; // px padding top & bottom
  const W    = canvas.parentElement.clientWidth - 44;
  const scale = W / 3.5;                    // 1 SVG unit → scale px
  const H    = Math.round(1.75 * scale) + PAD * 2;
  const DPR  = devicePixelRatio || 1;
  canvas.width        = W * DPR;
  canvas.height       = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Background
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = COLORS.bg;
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 10);
  ctx.fill();

  if (total === 0) {
    ctx.fillStyle    = '#9E99A3';
    ctx.font         = `13px 'Google Sans', sans-serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Enter numbers above to see the chamber', W / 2, H / 2);
    return;
  }

  const { seats, radius, rows } = buildSeatPositions(total);

  // SVG coords: x in [0..3.5], y in [0..1.75], origin top-left,
  // semicircle centre at (1.75, 1.75) = bottom-centre.
  // Canvas: x=0 left, y=0 top. Map: px = svgX*scale, py = (1.75-svgY)*scale + PAD
  const pxR = Math.max(2, radius * scale);

  // Colour: seats sorted left→right; oppose fills from left, then neutral, then support from right.
  // After sort descending by angle: index 0 = leftmost = first oppose seat.
  seats.forEach(([angle, sx, sy], i) => {
    let color;
    if      (i < nO)           color = 'oppose';
    else if (i < nO + nN)      color = 'neutral';
    else                       color = 'support';

    const px = sx * scale;
    const py = (1.75 - sy) * scale + PAD;

    ctx.beginPath();
    ctx.arc(px, py, pxR, 0, Math.PI * 2);
    ctx.fillStyle   = COLORS[color];
    ctx.globalAlpha = 0.88;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(px, py, pxR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth   = 0.8;
    ctx.globalAlpha = 1;
    ctx.stroke();
  });

  // Podium arc at bottom centre (SVG centre = x:1.75, y:1.75)
  const podR = 0.4 / rows * scale * 1.8;
  const podX = 1.75 * scale;
  const podY = 1.75 * scale + PAD;
  ctx.beginPath();
  ctx.arc(podX, podY, podR, Math.PI, 0);
  ctx.strokeStyle = COLORS.podium;
  ctx.lineWidth   = 1.5;
  ctx.globalAlpha = 0.7;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Speaker dot
  ctx.beginPath();
  ctx.arc(podX, podY - podR, 3, 0, Math.PI * 2);
  ctx.fillStyle = COLORS.podium;
  ctx.fill();
}

[inpS, inpO, inpN].forEach(el => el.addEventListener('input', draw));
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
